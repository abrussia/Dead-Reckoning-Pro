name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'
          validate-wrappers: false

      - name: Download AChartEngine
        run: |
          mkdir -p app/libs
          curl -fL -o app/libs/achartengine-1.1.0.jar \
            https://raw.githubusercontent.com/nisargnp/DeadReckoning/master/app/src/libs/achartengine-1.1.0.jar

      - name: Build
        run: gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: DeadReckoningPro-apk
          path: app/build/outputs/apk/debug/*.apk